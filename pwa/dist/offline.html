<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00106e" />
    <title>Offline — AI Era Jobs</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #e6e6e6; color: #00106e; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 480px); padding: 32px; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px #00000014; text-align: center; }
      h1 { margin-top: 0; }
      button, a { display: inline-block; min-height: 44px; margin: 8px 4px 0; padding: 10px 18px; border: 1px solid #00106e; border-radius: 8px; background: #00106e; color: #fff; font: inherit; text-decoration: none; cursor: pointer; }
      a { background: #fff; color: #00106e; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The connection is unavailable. Your saved vacancies are still available when you return to the app.</p>
      <button type="button" onclick="location.reload()">Retry connection</button>
      <a href="./">Back to AI Era Jobs</a>
    </main>
  </body>
</html>
